# ltq・MCP サーバーのテスト(Windows と Linux)と、ltidx のビルドとテスト・make-cdb のテスト(Windows、LLVM の公式配布物を使う)
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']  # v<plugin.json の version> のタグを手で push したときも、ltidx の配布物をリリースに載せる(release ジョブ)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: ltq / MCP (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: '3.10' }
          - { os: windows-latest, python: '3.13' }
          - { os: ubuntu-latest, python: '3.13' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: ltq
        run: python -I -W error::ResourceWarning -m unittest discover -s query/test -v
      - name: MCP server
        run: python -I -W error::ResourceWarning -m unittest discover -s mcp/test -v

  indexer:
    name: ltidx (Windows)
    runs-on: windows-latest
    env:
      LLVM_VERSION: 23.1.4
      LLVM_ROOT: C:\llvm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # ビルドに要るのは include と lib だけ(bin は 3 GB を超える)。LLVM の CMake 設定は bin の実行ファイルの
      # 存在を確かめるので、bin に載る名前だけ空のファイルを置く
      - name: Get LLVM
        shell: bash
        run: |
          name=clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc
          curl -fsSL --retry 5 --retry-delay 15 -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz"
          mkdir -p /c/llvm
          tar -xf llvm.tar.xz -C /c/llvm --strip-components=1 "$name/include" "$name/lib"
          rm llvm.tar.xz
          curl -fsSL --retry 5 --retry-delay 15 -o /c/llvm/LICENSE.TXT "https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-$LLVM_VERSION/llvm/LICENSE.TXT"
          grep -ho '_IMPORT_PREFIX}/bin/[^"]*' /c/llvm/lib/cmake/*/*.cmake | sed 's|_IMPORT_PREFIX}/||' | sort -u |
            while read -r f; do mkdir -p "/c/llvm/$(dirname "$f")"; touch "/c/llvm/$f"; done
          ls /c/llvm/lib/clang
      - name: Build ltidx
        shell: cmd
        run: indexer\build.bat
      - name: Test ltidx
        shell: cmd
        run: indexer\test\run_test.bat
      - name: Test make-cdb / index-project
        shell: cmd
        run: scripts\test\run_test.bat
      # 索引の自動更新のテストは ltidx.exe が要るので、ltq / MCP のジョブでは飛ばされる。ここで流し、飛ばさせない
      - name: Test the auto-update of the MCP server
        shell: cmd
        env:
          CRI_REQUIRE_LTIDX: '1'
        run: python -I -W error::ResourceWarning -m unittest discover -s mcp/test -v
      # LLVM 無しで使える配布物(ltidx.exe・clang の組み込みヘッダー・ライセンス)。scripts\get-ltidx.ps1 が取ってくる
      # ltidx.exe に埋め込まれた LLVM の中の別ライセンスの部品(BSD・Unicode)の表示を、その版のソースから作る(リポジトリには置かない)
      - name: Package ltidx
        shell: pwsh
        run: |
          python -I scripts\llvm-notices.py --version $env:LLVM_VERSION --out dist\THIRD-PARTY-NOTICES.txt
          scripts\package-ltidx.ps1 -LlvmLicense C:\llvm\LICENSE.TXT -ThirdPartyNotices dist\THIRD-PARTY-NOTICES.txt -OutDir dist
          # 配る zip にライセンスの表示がそろっているか(欠けていればリリースに載せない)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path dist\cxxref-ltidx-win-x64.zip))
          $names = $z.Entries.FullName; $z.Dispose()
          foreach ($n in 'ltidx.exe', 'LICENSE.txt', 'LICENSE-LLVM.txt', 'THIRD-PARTY-NOTICES.txt') {
            if ($names -notcontains $n) { throw "the package lacks $n" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: cxxref-ltidx-win-x64
          path: |
            dist/cxxref-ltidx-win-x64.zip
            dist/cxxref-ltidx-win-x64.zip.sha256

  # ltidx の配布物を GitHub のリリースに載せる。
  # - main への push: plugin.json の版のリリースがまだ無ければ、タグ v<版> をそのコミットに付けて作る(版を上げることがリリースになる。
  #   GITHUB_TOKEN で作ったタグでは別のワークフローが起動しないので、タグの作成とリリースはこのジョブでまとめて行う)。あれば何もしない
  # - タグ v<版> の push(手で付けたとき): そのタグでリリースを作る。版は plugin.json と一致しなければ止める
  # 取ってきた ltidx の版をプラグインの版と比べるので(/cxxref-index・MCP サーバー)、版を上げたのにリリースが無い状態を作らない
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [python, indexer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Decide the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import json; print(json.load(open('plugin.json'))['version'])")
          m=$(python3 -c "import json; print(json.load(open('.github/plugin/marketplace.json'))['plugins'][0]['version'])")
          test "$m" = "$v" || { echo "marketplace.json $m != plugin.json $v"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != plugin.json v$v"; exit 1; }
          fi
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release v$v already exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "will release v$v at $GITHUB_SHA"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.plan.outputs.skip != 'true'
        with:
          name: cxxref-ltidx-win-x64
          path: dist
      - name: Create the release
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # タグがまだ無ければ(main への push)、--target のコミットにタグを作る
          gh release create "$TAG" dist/cxxref-ltidx-win-x64.zip dist/cxxref-ltidx-win-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "cxxref $TAG" --notes "ltidx の配布物(LLVM 無しで使える)。scripts\\get-ltidx.bat が取ってきます。"
